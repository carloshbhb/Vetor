name: videos-diarios

# 100% ONLINE e GRÁTIS (sem PC): gera até 30 Shorts/dia do backlog,
# depois os novos do dia. Runners grátis: ~2000 min/mês (usamos ~150).
on:
  schedule:
    - cron: '0 14 * * *' # 11h Brasília, após o video-queue da Vercel (13h UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Qtd de vídeos (máx 30)'
        default: '30'

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar ffmpeg + edge-tts (grátis)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts
          ffmpeg -version | head -1

      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund

      - name: Renderizar + publicar até 30 vídeos
        env:
          SITE_BASE: ${{ secrets.SITE_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          VIDEO_LIMIT: ${{ inputs.limit || '30' }}
        run: node scripts/video-worker-ci.mjs
