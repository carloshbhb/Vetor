name: videos-diarios

# 100% ONLINE e GRÁTIS (sem PC): gera até 30 Shorts/dia do backlog,
# depois os novos do dia. Runners grátis: ~2000 min/mês (usamos ~150).
# Dividido em 3 runs de ~10 vídeos cada (cabem no timeout de 60 min).
on:
  schedule:
    - cron: '0 13 * * *'   # 10h Brasilia (manha)
    - cron: '0 18 * * *'   # 15h Brasilia (tarde)
    - cron: '0 23 * * *'   # 20h Brasilia (noite)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Qtd de videos por run (max 10)'
        default: '10'
      offset:
        description: 'Offset do dia para run manual'
        default: '0'

env:
  VIDEO_BATCH: '10'

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar ffmpeg + edge-tts (gratis)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts
          ffmpeg -version | head -1

      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund

      - name: Renderizar + publicar ate 10 videos
        env:
          SITE_BASE: ${{ secrets.SITE_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          VIDEO_LIMIT: ${{ inputs.limit || '10' }}
        run: node scripts/video-worker-ci.mjs

      # Premium: 1 vídeo/dia com Remotion (só no primeiro run)
      - name: Instalar deps Remotion
        if: github.event.schedule.cron == '0 13 * * *' || (github.event_name == 'workflow_dispatch')
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Cache Remotion browser
        if: github.event.schedule.cron == '0 13 * * *' || (github.event_name == 'workflow_dispatch')
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: remotion-browser-${{ runner.os }}-

      - name: Preparar Remotion browser
        if: github.event.schedule.cron == '0 13 * * *' || (github.event_name == 'workflow_dispatch')
        working-directory: remotion
        run: npx remotion browser ensure || true

      - name: Renderizar premium (Remotion)
        if: github.event.schedule.cron == '0 13 * * *' || (github.event_name == 'workflow_dispatch')
        env:
          SITE_BASE: ${{ secrets.SITE_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scripts/remotion-worker.mjs
