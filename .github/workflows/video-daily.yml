name: videos-diarios

# 100% Remotion: 16 Shorts/dia (2 runs × 8 cada)
# Runners grátis: ~2000 min/mês (usamos ~640 para 16 vídeos × 40 min render cada)
on:
  schedule:
    - cron: '0 13 * * *'   # 10h Brasilia (manhã) - 8 vídeos
    - cron: '0 18 * * *'   # 15h Brasilia (tarde) - 8 vídeos
  workflow_dispatch:
    inputs:
      limit:
        description: 'Qtd de vídeos por run (max 8)'
        default: '8'

env:
  REMOTION_BATCH: '8'

jobs:
  render-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar ffmpeg + edge-tts (gratis)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts
          ffmpeg -version | head -1

      - name: Instalar deps do projeto
        run: npm ci --no-audit --no-fund

      - name: Instalar deps Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('remotion/package-lock.json') }}
          restore-keys: remotion-browser-${{ runner.os }}-

      - name: Preparar Remotion browser
        working-directory: remotion
        run: npx remotion browser ensure || true

      - name: Renderizar + publicar 8 vídeos (Remotion)
        env:
          SITE_BASE: ${{ secrets.SITE_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: public
          REMOTION_BATCH: ${{ inputs.limit || '8' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scripts/remotion-worker-batch.mjs
