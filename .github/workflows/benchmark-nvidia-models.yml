name: NVIDIA Model Benchmark

on:
  push:
    paths:
      - '.github/workflows/benchmark-nvidia-models.yml'
      - 'scripts/benchmark-nvidia-models.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Compare NVIDIA models with the same editorial prompt
        run: npm run benchmark:nvidia
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-model-benchmark
          path: artifacts/nvidia-model-benchmark.json
          if-no-files-found: warn
          retention-days: 14
