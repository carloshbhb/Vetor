name: Stickman Review — Visual Redesign QA

on:
  push:
    branches: [main]
    paths:
      - "video/src/compositions/StickmanReviewLandscape.tsx"
      - "video/scripts/stickman-review-pilot.mjs"
      - ".github/workflows/stickman-review-visual-redesign.yml"

permissions:
  contents: read

jobs:
  render-review-pilot:
    name: Render and inspect the redesigned Portuguese review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Edge TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Install repository dependencies
        run: |
          npm ci
          cd video
          npm ci

      - name: Validate the stickman template contract
        run: node video/scripts/stickman-template.test.mjs

      - name: Type-check Remotion
        working-directory: video
        run: npx tsc --noEmit

      - name: Install Remotion QA and Chromium
        working-directory: video
        run: |
          npm install --global remotion-qa@0.1.3
          ./node_modules/.bin/remotion browser ensure --log info

      - name: Render Portuguese Galaxy Fit3 review
        env:
          EDGE_TTS_RATE: "+3%"
        run: node video/scripts/stickman-review-pilot.mjs

      - name: Create visual contact sheet for review
        if: always()
        run: |
          if [ -f video/out/stickman-galaxy-fit3-remotion.mp4 ]; then
            ffmpeg -y -i video/out/stickman-galaxy-fit3-remotion.mp4 \
              -vf "fps=1/5,scale=640:-1,tile=3x3" -frames:v 1 \
              video/out/stickman-galaxy-fit3-redesign-contact.png
          fi

      - name: Preserve redesigned pilot and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetor-stickman-galaxy-fit3-redesign
          path: |
            video/out/stickman-galaxy-fit3-remotion.mp4
            video/out/stickman-galaxy-fit3-remotion-report.json
            video/out/galaxy-fit3-stickman-remotion-props.json
            video/out/stickman-galaxy-fit3-redesign-contact.png
          if-no-files-found: error
          retention-days: 14
