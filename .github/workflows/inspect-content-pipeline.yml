name: Inspect Content Pipeline

on:
  workflow_dispatch:
    inputs:
      fix_source_label_categories:
        description: 'Corrigir a categoria de drafts que herdaram um rotulo de origem'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect reviews, affiliate queue and match status
        run: npx tsx scripts/inspect-content-pipeline.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Normalize draft categories (only drafts with source-label categories)
        if: inputs.fix_source_label_categories == true
        run: npx tsx scripts/normalize-review-categories.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
