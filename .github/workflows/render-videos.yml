name: Render & Publish Videos

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Video Queue ID to process'
        required: false
        type: string
      process_all_pending:
        description: 'Process all pending videos'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [render_video]
  schedule:
    - cron: '0 */6 * * *'

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  process-video-queue:
    name: Process Video Queue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: video/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install edge-tts
        run: pip install edge-tts --quiet

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install video dependencies
        working-directory: ./video
        run: npm ci

      - name: Fetch pending videos from Supabase
        id: fetch-videos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESULT=$(curl -s -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
               "$SUPABASE_URL/rest/v1/video_queue?status=eq.pending&order=created_at.asc&limit=3&select=*")
          echo "VIDEOS_JSON=$RESULT" >> $GITHUB_OUTPUT
          echo "COUNT=$(echo $RESULT | jq length)" >> $GITHUB_OUTPUT
          echo "Found $COUNT pending videos"

      - name: Process each video
        if: steps.fetch-videos.outputs.COUNT != '0'
        working-directory: ./video
        run: |
          VIDEOS='${{ steps.fetch-videos.outputs.VIDEOS_JSON }}'
          echo "$VIDEOS" | jq -c '.[]' | while read -r video; do
            VIDEO_ID=$(echo "$video" | jq -r '.id')
            echo "Processing video: $VIDEO_ID"
            
            # Update status to processing
            curl -s -X PATCH -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"processing\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
              "$SUPABASE_URL/rest/v1/video_queue?id=eq.$VIDEO_ID"
            
            # Run the video processing script
            npx tsx scripts/process-video.js "$VIDEO_ID" "$video" || {
              echo "Failed to process video $VIDEO_ID"
              curl -s -X PATCH -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Content-Type: application/json" \
                -d '{"status":"failed","error_message":"Processing failed"}' \
                "$SUPABASE_URL/rest/v1/video_queue?id=eq.$VIDEO_ID"
              continue
            }
            
            echo "Successfully processed video: $VIDEO_ID"
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  render-video:
    name: Render Video with Remotion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: process-video-queue
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: video/package-lock.json

      - name: Install video dependencies
        working-directory: ./video
        run: npm ci

      - name: Render video
        working-directory: ./video
        run: |
          npx remotion render ReviewVideo out/video.mp4 --props=./render-props.json
        env:
          REMOTION_SERVE_URL: http://localhost:3000

  upload-to-youtube:
    name: Upload to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: render-video
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Upload to YouTube
        run: node scripts/upload-to-youtube.js
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PATH: ./video/out/video.mp4
          VIDEO_TITLE: ${{ needs.process-video-queue.outputs.video_title }}
          VIDEO_DESCRIPTION: ${{ needs.process-video-queue.outputs.video_description }}
          VIDEO_TAGS: ${{ needs.process-video-queue.outputs.video_tags }}