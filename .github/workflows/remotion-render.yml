name: Render Remotion Videos

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Type of video to render'
        type: choice
        required: true
        options:
          - review
          - comparison
      data_file:
        description: 'Path to JSON data file (optional, uses sample if omitted)'
        type: string
        required: false
      title:
        description: 'Custom title for the video (used in artifact name)'
        type: string
        required: false

  push:
    paths:
      - 'video/**'
      - '.github/workflows/remotion-render.yml'
    branches:
      - main
      - fix/remotion-captions-mainline

permissions:
  contents: read
  actions: read

concurrency:
  group: remotion-render-${{ github.ref }}-${{ github.event.inputs.video_type || 'auto' }}
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ github.event.inputs.video_type || 'auto-detect' }} video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: video

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for headless rendering
        uses: browser-actions/setup-chrome@v1.2.0
        with:
          chrome-version: stable

      - name: Verify Chrome installation
        run: |
          google-chrome --version
          which google-chrome

      - name: Create clean output directory
        run: |
          mkdir -p out
          # This runner is ephemeral; remove checked-out/previous MP4s so a later step
          # cannot mistake an old render for the file produced by this run.
          find out -maxdepth 1 -type f -name '*.mp4' -delete

      - name: Render video
        id: render
        env:
          REMOTION_CHROME_PATH: /usr/bin/google-chrome
          REMOTION_GL: angle
        run: |
          TYPE="${{ github.event.inputs.video_type || 'review' }}"
          DATA_FILE="${{ github.event.inputs.data_file }}"
          TITLE="${{ github.event.inputs.title }}"

          if [ -z "$TYPE" ]; then
            echo "::error::video_type input is required for workflow_dispatch"
            exit 1
          fi

          if [ -n "$DATA_FILE" ] && [ -f "$DATA_FILE" ]; then
            echo "Rendering $TYPE video with data from $DATA_FILE"
            npx tsx src/utils/renderVideo.ts "$TYPE" "$DATA_FILE"
          else
            echo "Rendering $TYPE video with sample data"
            npx tsx src/utils/renderVideo.ts "$TYPE"
          fi

      - name: Find and validate fresh rendered video
        id: find-video
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find out -maxdepth 1 -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Remotion did not create a fresh MP4 in out/"
            exit 1
          fi

          VIDEO_FILE="${FILES[0]#* }"
          PROBE_JSON="$(ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json "$VIDEO_FILE")"
          echo "$PROBE_JSON" | jq -e '
            (.format.duration | tonumber > 0) and
            any(.streams[]?; .codec_type == "video" and (.width | tonumber) > 0 and (.height | tonumber) > 0)
          ' >/dev/null || {
            echo "::error::The MP4 from this run failed ffprobe integrity validation."
            exit 1
          }

          DURATION="$(echo "$PROBE_JSON" | jq -r '.format.duration')"
          CODEC="$(echo "$PROBE_JSON" | jq -r '.streams[] | select(.codec_type == "video") | .codec_name' | head -1)"
          # Artifact actions execute from the workspace root, not the step's video/ working directory.
          echo "video_path=video/$VIDEO_FILE" >> "$GITHUB_OUTPUT"
          echo "video_duration=$DURATION" >> "$GITHUB_OUTPUT"
          echo "video_codec=$CODEC" >> "$GITHUB_OUTPUT"
          echo "Fresh MP4 validated: $VIDEO_FILE (${DURATION}s, codec=${CODEC})"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video_type || 'remotion-video' }}-${{ github.run_number }}
          path: ${{ steps.find-video.outputs.video_path }}
          retention-days: 30
          compression-level: 6

      - name: Upload all rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: all-videos-${{ github.run_number }}
          path: video/out/*.mp4
          retention-days: 7
          compression-level: 6

      - name: Render summary
        if: always()
        run: |
          echo "## Render Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.video_type || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Video**: ${{ steps.find-video.outputs.video_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ steps.find-video.outputs.video_duration || 'not validated' }} seconds" >> $GITHUB_STEP_SUMMARY
          echo "- **Video codec**: ${{ steps.find-video.outputs.video_codec || 'not validated' }}" >> $GITHUB_STEP_SUMMARY
          ls -lh out/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No output files"