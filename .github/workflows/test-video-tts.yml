name: Test Edge TTS Neural Voice

on:
  push:
    branches: [main]
    paths:
      - 'video/scripts/process-video.mjs'
      - 'video/scripts/video-format.mjs'
      - 'video/scripts/video-format.test.mjs'
      - 'video/scripts/tts-alignment-fixture.json'
      - 'video/scripts/tts-alignment-asus.json'
      - 'video/scripts/validate-tts-alignment.mjs'
      - 'scripts/tts.py'
      - 'src/lib/tts.ts'
      - '.github/workflows/create-remotion-edge-video.yml'
      - '.github/workflows/process-video-queue.yml'
      - '.github/workflows/test-video-tts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Validate the single pt-BR neural voice (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript syntax
        run: |
          node --check video/scripts/process-video.mjs
          node --check video/scripts/validate-tts-alignment.mjs

      - name: Install FFmpeg and Edge TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check edge-tts

      - name: Test the application Edge TTS wrapper
        run: |
          set -euo pipefail
          python scripts/tts.py "Teste de voz neural do Vetor." /tmp/vetor-edge-wrapper.mp3 > /tmp/vetor-edge-wrapper.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/vetor-edge-wrapper.json").read_text())
          audio = Path("/tmp/vetor-edge-wrapper.mp3")
          assert result.get("voice") == "pt-BR-FranciscaNeural", result
          assert result.get("rate") == "+5%", result
          assert audio.exists() and audio.stat().st_size > 1000, "Edge TTS wrapper did not create a valid MP3"
          print("PASS: Python wrapper generated Edge TTS pt-BR-FranciscaNeural.")
          PY
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/vetor-edge-wrapper.mp3

      - name: Validate real Edge TTS alignment on production-shaped scripts
        run: |
          set -euo pipefail
          for FIXTURE in video/scripts/tts-alignment-fixture.json video/scripts/tts-alignment-asus.json; do
            NAME="$(basename "$FIXTURE" .json)"
            OUT="tts-alignment-evidence/$NAME"
            mkdir -p "$OUT"
            SCRIPT="$(FIXTURE="$FIXTURE" node -e 'const fs=require("fs"); const f=JSON.parse(fs.readFileSync(process.env.FIXTURE,"utf8")); process.stdout.write(f.segments.map((segment) => segment.text).join(" "))')"
            EDGE_TTS_BOUNDARIES_PATH="$OUT/boundaries.jsonl" \
              python scripts/tts.py "$SCRIPT" "$OUT/audio.mp3" > "$OUT/metadata.json"
            node video/scripts/validate-tts-alignment.mjs \
              "$FIXTURE" "$OUT/audio.mp3" "$OUT/boundaries.jsonl" "$OUT/metadata.json"
          done

      - name: Preserve TTS alignment evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-alignment-evidence
          path: tts-alignment-evidence/
          if-no-files-found: ignore

      - name: Test the only configured neural voice
        run: TTS_SMOKE_TEST=true node video/scripts/process-video.mjs
