name: Technical Audit Checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.github/workflows/technical-audit-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.github/workflows/technical-audit-checks.yml'

permissions:
  contents: read

concurrency:
  group: technical-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JSON-LD security regression test
        run: npm run test:json-ld

      - name: Editorial HTML sanitization regression test
        run: npm run test:sanitize

      - name: Review persistence regression test
        run: npm run test:review-persistence

      - name: Editorial quality tests
        run: |
          npm run test:content-quality
          npm run test:editorial-brief
          npm run test:viral-quality

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
