name: Generate Daily Video Queue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-videos.yml'
      - 'src/app/api/cron/video-queue-worker/route.ts'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of real published reviews to queue'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Queue videos from published reviews via production API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          COUNT="${COUNT:-1}"
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
            echo "::error::COUNT must be a positive integer"
            exit 1
          fi
          if [ "$COUNT" -gt 10 ]; then COUNT=10; fi

          ready=0
          for attempt in $(seq 1 18); do
            curl_exit=0
            code="$(curl -sS --max-time 12 -o result.json -w '%{http_code}' \
              -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"action\":\"queueFromReviews\",\"limit\":$COUNT}" || curl_exit=$?)"
            if [ "$curl_exit" -eq 0 ] && [ "$code" = "200" ] && jq -e '.success == true and (.queued | type == "number")' result.json >/dev/null; then
              ready=1
              break
            fi
            if [ "$curl_exit" -eq 0 ] && [ "$code" != "404" ] && [[ ! "$code" =~ ^5 ]]; then
              cat result.json 2>/dev/null || true
              echo "::error::Queue API rejected request (HTTP $code)."
              exit 1
            fi
            echo "Production queue API not ready (attempt $attempt, curl=$curl_exit, HTTP=${code:-000})."
            if [ "$attempt" -lt 18 ]; then sleep 10; fi
          done
          if [ "$ready" -ne 1 ]; then
            cat result.json 2>/dev/null || true
            echo "::error::Production queue API did not become ready."
            exit 1
          fi
          jq .
          echo "Confirmed queue insertions: $(jq -r '.queued' result.json)"
