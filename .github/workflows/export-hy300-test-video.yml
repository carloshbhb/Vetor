name: Export isolated HY300 Remotion test video

on:
  push:
    branches:
      - test/product-hy300-video
    paths:
      - .github/workflows/export-hy300-test-video.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-test-video:
    name: Download and validate HY300 MP4
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download isolated sandbox render
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --connect-timeout 15 --max-time 240 \
            "https://sb-61kpdxrgejlh.vercel.run/vetor-hy300-test.mp4" \
            --output vetor-hy300-product-test.mp4
          test "$(stat -c%s vetor-hy300-product-test.mp4)" -gt 1000000

      - name: Validate streams and create contact sheet
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,codec_type \
            -show_entries format=duration,size \
            -of json vetor-hy300-product-test.mp4 | tee video-metadata.json
          grep -q '"width": 1920' video-metadata.json
          grep -q '"height": 1080' video-metadata.json
          grep -q '"codec_name": "h264"' video-metadata.json
          grep -q '"codec_name": "aac"' video-metadata.json
          ffmpeg -y -v error -i vetor-hy300-product-test.mp4 \
            -vf "fps=1/28,scale=640:-1,tile=4x2" -frames:v 1 \
            vetor-hy300-product-test-contact-sheet.jpg

      - name: Upload downloadable test files
        uses: actions/upload-artifact@v4
        with:
          name: hy300-remotion-product-test
          path: |
            vetor-hy300-product-test.mp4
            vetor-hy300-product-test-contact-sheet.jpg
            video-metadata.json
          if-no-files-found: error
          retention-days: 4
