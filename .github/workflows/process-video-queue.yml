name: Process Video Queue
run-name: Publish 10 long videos — two batches of 5

concurrency:
  group: vetor-production-video-queue
  cancel-in-progress: false

on:
  # One-shot manual end-to-end validation (generation + YouTube upload, outside auto quota).
  push:
    branches: [main]
    paths:
      - '.ops/run-manual-video-generation'
      - '.ops/run-manual-long-video-batch-2'
  # Independent long-form video production: 08:00 and 20:00 in Sao Paulo (UTC-03), 5 videos per batch.
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Batch publishes up to 5 queued videos; single retries one specific queue item.'
        required: true
        default: batch
        type: choice
        options:
          - batch
          - single
      video_id:
        description: 'Queue item ID (used only when run_mode=single)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  process-queue:
    name: Render and publish queued videos
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'run-manual-video-generation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python TTS
        run: pip install edge-tts aiohttp
      - name: Install dependencies
        run: |
          npm ci --onnxruntime-node-install-cuda=skip
          cd video
          npm ci --onnxruntime-node-install-cuda=skip
      - name: Type-check Remotion project before any queue operation
        working-directory: video
        run: npx tsc --noEmit
      - name: Install HyperFrames fallback CLI
        run: |
          npm install --global hyperframes@0.9.2
          hyperframes doctor
      - name: Validate optional HyperFrames fallback renderer
        run: |
          node video/hyperframes/library.test.mjs
          node video/hyperframes/smoke-render.mjs
      - name: Install Remotion retention and safe-zone QA
        run: npm install --global remotion-qa@0.1.3
      - name: Validate format, storyboard and chapter contracts
        run: |
          python video/scripts/fetch-trending-news.py --self-test
          node --check video/scripts/process-video.mjs
          node --check video/scripts/render-lemo-opuscar.mjs
          node video/scripts/video-format.test.mjs
          node video/scripts/stickman-template.test.mjs
          node video/scripts/render-engine-router.test.mjs
          node video/scripts/lemo-style-catalog.test.mjs
          cd video
          node --import tsx scripts/visual-storyboard.test.mjs
          node --import tsx scripts/shorts-safe-zone-layout.test.mjs
          node --import tsx scripts/landscape-safe-zone-layout.test.mjs
          node --import tsx scripts/caption-window.test.mjs
          node --import tsx scripts/scene-headline.test.mjs
      - name: Preinstall Remotion Chrome Headless Shell
        working-directory: video
        timeout-minutes: 15
        run: ./node_modules/.bin/remotion browser ensure --log info
      - name: Wait for authenticated production queue API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          ready=0
          for attempt in $(seq 1 24); do
            curl_exit=0
            code="$(curl -sS --max-time 12 -o queue-api-ready.json -w '%{http_code}' \
              -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"action":"recent"}' || curl_exit=$?)"
            if [ "$curl_exit" -eq 0 ] && [ "$code" = "200" ] && jq -e '.success == true' queue-api-ready.json >/dev/null; then
              echo "Production queue API is ready."
              ready=1
              break
            fi
            echo "Queue API not ready yet (attempt $attempt, curl=$curl_exit, HTTP=${code:-000})."
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          if [ "$ready" -ne 1 ]; then
            cat queue-api-ready.json 2>/dev/null || true
            echo "::error::Production queue API did not become ready; refusing to use stale/incorrect database credentials."
            exit 1
          fi
      - name: Fill this batch with fresh news and relevant products
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_mode != 'single' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
          VIDEO_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'single' && github.event.inputs.video_id || '' }}
          MANUAL_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'run-manual-video-generation') && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VIDEO_ID:-}" ]; then
            echo "A specific video ID was requested; queue generation is skipped."
            exit 0
          fi
          manual_json=false
          [ "$MANUAL_RUN" = "true" ] && manual_json=true

          call_api() {
            local action="$1"
            local limit="${2:-5}"
            local output="$3"
            local payload
            payload="$(jq -cn --arg action "$action" --argjson limit "$limit" --argjson manual "$manual_json" \
              '{action:$action,limit:$limit,format:"long",manualOverride:$manual}')"
            local code
            code="$(curl -sS --max-time 60 -o "$output" -w '%{http_code}' \
              -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "$payload")"
            if [ "$code" != "200" ] || ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::Queue feeder failed for action=$action (HTTP=$code)."
              jq -r '.error // .message // "No safe diagnostic returned."' "$output" || true
              exit 1
            fi
          }

          # This action can only retry prior long-form failures with no confirmed upload.
          call_api "retrySafeFailed" 5 retry-safe-failed.json
          retried_failed="$(jq -r '.retried // 0' retry-safe-failed.json)"
          echo "Safe long-form failed retries restored: $retried_failed"

          # Peek without changing status. Existing due long videos consume the batch first.
          call_api "next" 5 batch-peek.json
          if [ "$MANUAL_RUN" = "true" ]; then
            remaining=5
          else
            remaining="$(jq -r 'if (.remaining // 0) > 0 then ([5, (.remaining|tonumber)] | min) else 0 end' batch-peek.json)"
          fi
          pending="$(jq -r '(.videos // []) | length' batch-peek.json)"
          slots=$((remaining - pending))
          if [ "$slots" -le 0 ]; then
            echo "Batch already full or daily 10-long-video quota reached; no new queue entries created."
            exit 0
          fi

          python video/scripts/fetch-trending-news.py --output trend-news.json
          trend_count="$(jq 'length' trend-news.json)"
          echo "Fresh trend topics with related source headlines: $trend_count"
          queued_trends=0
          if [ "$trend_count" -gt 0 ]; then
            trend_payload="$(jq -cn --argjson topics "$(cat trend-news.json)" --argjson limit "$slots" --argjson manual "$manual_json" \
              '{action:"queueTrendingVideos",format:"long",limit:$limit,trendTopics:$topics,manualOverride:$manual}')"
            code="$(curl -sS --max-time 60 -o queue-trending-news.json -w '%{http_code}' \
              -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d "$trend_payload")"
            if [ "$code" = "200" ] && jq -e '.success == true' queue-trending-news.json >/dev/null; then
              queued_trends="$(jq -r '.queued // 0' queue-trending-news.json)"
            else
              echo "::warning::News matching failed; continuing with the verified product fallback."
              cat queue-trending-news.json 2>/dev/null || true
            fi
          fi
          echo "News-led long videos queued: $queued_trends"

          if [ "$queued_trends" -lt "$slots" ]; then
            remaining_slots=$((slots - queued_trends))
            call_api "queueFromSocialList" "$remaining_slots" queue-social-list.json
            queued_social="$(jq -r '.queued // 0' queue-social-list.json)"
            echo "Social List long-form fallback: $queued_social item(s)."
            if [ "$queued_social" -lt "$remaining_slots" ]; then
              catalog_slots=$((remaining_slots - queued_social))
              call_api "queueFromProductCatalog" "$catalog_slots" queue-product-catalog.json
              queued_catalog="$(jq -r '.queued // 0' queue-product-catalog.json)"
              echo "Verified product catalog fallback: $queued_catalog item(s)."
            fi
          fi
          echo "Production batch feeder complete: due=$pending, news=$queued_trends, target slots=$slots; daily cap=10 long videos.";
      - name: Render, describe, and upload videos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
          VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          MANUAL_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'run-manual-video-generation') && 'true' || 'false' }}
          MAX_VIDEOS: '5'
          PUBLICATION_FORMAT: long
          EDGE_TTS_RATE: "${{ vars.EDGE_TTS_RATE || '+5%' }}"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          VIDEO_RENDER_ENGINE: auto
          HYPERFRAMES_REMOTION_FALLBACK: 'true'
          LEMO_REMOTION_FALLBACK: 'true'
          LEMO_OPUSCAR_HOME: ${{ runner.temp }}/vetor-lemo-opuscar
          HYPERFRAMES_BIN: hyperframes
          HYPERFRAMES_WORKERS: '2'
        run: node video/scripts/process-video.mjs
      - name: Preserve failed renders and video QA evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-render-qa-failures-${{ github.run_id }}
          path: |
            video/out/video-*.mp4
            video/out/video-*-beats.json
            video/out/qa-*-frames/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Report latest queue status
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Queue state unavailable because CRON_SECRET is missing."
            exit 0
          fi
          echo "HISTÓRICO DA FILA: URLs abaixo podem ser antigas e não provam upload nesta execução."
          echo "Uploads desta execução: procure [UPLOAD_CONFIRMED_THIS_RUN] no passo anterior."
          curl -fsS --max-time 20 -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"action":"recent"}' | jq .
