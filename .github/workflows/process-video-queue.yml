name: Process Video Queue
run-name: Publish video batch — up to 5 videos

concurrency:
  group: vetor-production-video-queue
  cancel-in-progress: false

on:
  # Três lotes diários de 5 vídeos, separados por 8 horas; teto de 15 publicações/dia aplicado pela API.
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 13 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Optional queue item ID to retry after OAuth is fixed'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  process-queue:
    name: Render and publish queued videos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install Python TTS
        run: pip install edge-tts aiohttp
      - name: Install dependencies
        run: |
          npm ci
          cd video
          npm ci
      - name: Wait for authenticated production queue API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          ready=0
          for attempt in $(seq 1 24); do
            curl_exit=0
            code="$(curl -sS --max-time 12 -o queue-api-ready.json -w '%{http_code}' \
              -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"action":"recent"}' || curl_exit=$?)"
            if [ "$curl_exit" -eq 0 ] && [ "$code" = "200" ] && jq -e '.success == true' queue-api-ready.json >/dev/null; then
              echo "Production queue API is ready."
              ready=1
              break
            fi
            echo "Queue API not ready yet (attempt $attempt, curl=$curl_exit, HTTP=${code:-000})."
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          if [ "$ready" -ne 1 ]; then
            cat queue-api-ready.json 2>/dev/null || true
            echo "::error::Production queue API did not become ready; refusing to use stale/incorrect database credentials."
            exit 1
          fi
      - name: Render, describe, and upload videos
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
          VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          MAX_VIDEOS: '5'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_VOICE: 'pt-BR-AntonioNeural'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node video/scripts/process-video.mjs
      - name: Report latest queue status
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VETOR_SITE_URL: https://www.vetor.blog
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Queue state unavailable because CRON_SECRET is missing."
            exit 0
          fi
          echo "HISTÓRICO DA FILA: URLs abaixo podem ser antigas e não provam upload nesta execução."
          echo "Uploads desta execução: procure [UPLOAD_CONFIRMED_THIS_RUN] no passo anterior."
          curl -fsS --max-time 20 -X POST "$VETOR_SITE_URL/api/cron/video-queue-worker/" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"action":"recent"}' | jq .
