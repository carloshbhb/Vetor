name: Validate Video Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - "scripts/video-media-matching.test.ts"
      - "src/lib/video-media-matching.ts"
      - "src/app/api/cron/generate-video-script/route.ts"
      - ".github/workflows/video-pipeline-validation.yml"
  push:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - "scripts/video-media-matching.test.ts"
      - "src/lib/video-media-matching.ts"
      - "src/app/api/cron/generate-video-script/route.ts"
      - ".github/workflows/video-pipeline-validation.yml"

permissions:
  contents: read

concurrency:
  group: video-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: npm ci

      - name: Syntax-check Edge TTS metadata runner
        run: python -m py_compile scripts/tts.py

      - name: Validate storyboard and local media source contracts
        working-directory: video
        run: |
          node --import tsx scripts/visual-storyboard.test.mjs
          node scripts/media-source.test.mjs

      - name: Validate format, affiliate-link and chapter contracts
        run: node video/scripts/video-format.test.mjs

      - name: Validate worker JavaScript syntax
        run: node --check video/scripts/process-video.mjs && node --check video/scripts/video-format.mjs

      - name: Type-check Remotion project
        working-directory: video
        run: npx tsc --noEmit

      - name: Install Remotion browser
        working-directory: video
        run: npx remotion browser ensure --log info

      - name: Resolve Remotion compositions
        working-directory: video
        shell: bash
        run: |
          set -euo pipefail
          ids="$(npx remotion compositions src/Root.tsx --quiet)"
          echo "Detected Remotion compositions: $ids"
          for expected in ReviewVideo LongReviewVideo ComparisonVideo; do
            if ! grep -qw "$expected" <<< "$ids"; then
              echo "::error::Missing Remotion composition: $expected"
              exit 1
            fi
          done

      - name: Prepare local B-roll fixture
        working-directory: video
        run: |
          ffmpeg -y -f lavfi -i "testsrc2=size=540x960:rate=30" -t 6 -c:v libx264 -pix_fmt yuv420p public/smoke-broll.mp4
          test -s public/smoke-broll.mp4

      - name: Prepare Remotion render smoke props
        working-directory: video
        run: |
          test -s public/smoke-product.svg
          test -s public/audio/sample-review.mp3
          cat > /tmp/vetor-review-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/audio/sample-review.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 1,
            "scenes": [
              {"id": 1, "text": "Tela e desempenho para o uso cotidiano.", "duration": 4, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 30, "endFrame": 150}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [{"start": 1, "end": 5, "text": "Tela e desempenho para o uso cotidiano.", "segmentKind": "scene"}],
            "brollVideos": ["/smoke-broll.mp4"],
            "totalDuration": 6,
            "fps": 30
          }
          JSON
          cat > /tmp/vetor-landscape-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/audio/sample-review.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 2,
            "scenes": [
              {"id": 1, "text": "Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir.", "duration": 9, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 60, "endFrame": 330}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [{"start": 2, "end": 11, "text": "Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir.", "segmentKind": "scene"}],
            "brollVideos": [],
            "totalDuration": 12,
            "fps": 30
          }
          JSON

      - name: Render vertical Remotion sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx ReviewVideo /tmp/vetor-review-smoke.mp4 --props=/tmp/vetor-review-smoke-props.json --frames=0-179 --log=error

      - name: Render landscape Remotion sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx LongReviewVideo /tmp/vetor-landscape-smoke.mp4 --props=/tmp/vetor-landscape-smoke-props.json --frames=0-359 --log=error

      - name: Run Remotion visual QA on rendered samples
        run: |
          npm install --global remotion-qa@0.1.3
          cat > /tmp/vetor-review-smoke-beats.json <<'JSON'
          [{"start":1,"end":5,"text":"Tela e desempenho para o uso cotidiano."}]
          JSON
          cat > /tmp/vetor-landscape-smoke-beats.json <<'JSON'
          [{"start":2,"end":11,"text":"Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir."}]
          JSON
          remotion-qa check /tmp/vetor-review-smoke.mp4 --beats /tmp/vetor-review-smoke-beats.json --channel yt-shorts --max-dead 1 --frames /tmp/vetor-review-qa-frames --json
          remotion-qa check /tmp/vetor-landscape-smoke.mp4 --beats /tmp/vetor-landscape-smoke-beats.json --channel yt-landscape --max-dead 1 --frames /tmp/vetor-landscape-qa-frames --json

      - name: Preserve Remotion render evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-render-smoke-failure-${{ github.run_id }}
          path: |
            /tmp/vetor-review-smoke.mp4
            /tmp/vetor-landscape-smoke.mp4
            /tmp/vetor-review-qa-frames/**
            /tmp/vetor-landscape-qa-frames/**
          if-no-files-found: ignore
          retention-days: 7
