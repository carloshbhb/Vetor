name: Validate Video Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - "scripts/video-media-matching.test.ts"
      - "src/lib/video-media-matching.ts"
      - "src/app/api/cron/generate-video-script/route.ts"
      - "src/lib/script-generator.ts"
      - "scripts/script-generator-budget.test.ts"
      - "src/app/api/cron/video-queue-worker/route.ts"
      - "scripts/video-queue-quota.test.ts"
      - ".github/workflows/process-video-queue.yml"
      - ".github/workflows/video-pipeline-validation.yml"
  workflow_dispatch:
    inputs:
      run_visual_pilots:
        description: "Render os três pilotos visuais completos (execução manual)"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - "scripts/video-media-matching.test.ts"
      - "scripts/video-queue-quota.test.ts"
      - "src/lib/video-media-matching.ts"
      - "src/app/api/cron/generate-video-script/route.ts"
      - "src/lib/script-generator.ts"
      - "scripts/script-generator-budget.test.ts"
      - "src/app/api/cron/video-queue-worker/route.ts"
      - ".github/workflows/process-video-queue.yml"
      - ".github/workflows/video-pipeline-validation.yml"

permissions:
  contents: read

concurrency:
  group: video-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: npm ci

      - name: Syntax-check Edge TTS and Blender GLB export helpers
        run: python -m py_compile scripts/tts.py video/blender/export_product_glb.py

      - name: Validate storyboard and local media source contracts
        working-directory: video
        run: |
          node --import tsx scripts/visual-storyboard.test.mjs
          node --import tsx scripts/shorts-safe-zone-layout.test.mjs
          node --import tsx scripts/landscape-safe-zone-layout.test.mjs
          node --import tsx scripts/caption-window.test.mjs
          node --import tsx scripts/scene-headline.test.mjs
          node scripts/media-source.test.mjs

      - name: Validate independent long-video queue and daily quota
        run: npx tsx scripts/video-queue-quota.test.ts

      - name: Validate format, affiliate-link and chapter contracts
        run: node video/scripts/video-format.test.mjs

      - name: Validate worker and renderer JavaScript syntax
        run: |
          node --check video/scripts/process-video.mjs
          node --check video/scripts/video-format.mjs
          node --check video/scripts/render-lemo-opuscar.mjs
          node --check video/scripts/render-engine-router.mjs
          node --check video/scripts/visual-template-registry.mjs
          node --check video/scripts/visual-sequence-planner.mjs
          node --check video/scripts/product-model-verification.mjs
          node --check video/scripts/render-artifact-qa.mjs
          node --check video/scripts/visual-artifact-qa.mjs
          node video/scripts/product-model-verification.test.mjs
          node video/scripts/render-artifact-qa.test.mjs
          node video/scripts/visual-artifact-qa.test.mjs
          node --check video/scripts/shotcraft-recipe-registry.mjs
          node --check video/scripts/render-ten-style-pilot.mjs
          node video/scripts/render-engine-router.test.mjs
          node video/scripts/lemo-style-catalog.test.mjs
          node video/scripts/visual-template-registry.test.mjs
          node video/scripts/shotcraft-recipe-registry.test.mjs
          node video/scripts/visual-sequence-planner.test.mjs
          node --check video/scripts/visual-render-qa.mjs
          node video/scripts/scene-render-qa.test.mjs

      - name: Type-check Remotion project
        working-directory: video
        run: npx tsc --noEmit

      - name: Install Remotion browser
        working-directory: video
        run: npx remotion browser ensure --log info

      - name: Resolve Remotion compositions
        working-directory: video
        shell: bash
        run: |
          set -euo pipefail
          ids="$(npx remotion compositions src/Root.tsx --quiet)"
          echo "Detected Remotion compositions: $ids"
          for expected in ReviewVideo LongReviewVideo ComparisonVideo TemplateShowcase; do
            if ! grep -qw "$expected" <<< "$ids"; then
              echo "::error::Missing Remotion composition: $expected"
              exit 1
            fi
          done

      - name: Prepare local B-roll fixture
        working-directory: video
        run: |
          ffmpeg -y -f lavfi -i "testsrc2=size=540x960:rate=30" -t 6 -c:v libx264 -pix_fmt yuv420p public/smoke-broll.mp4
          test -s public/smoke-broll.mp4

      - name: Prepare Remotion render smoke props
        working-directory: video
        run: |
          test -s public/smoke-product.svg
          # The previous sample-review.mp3 fixture contains silence. Generate a
          # deterministic audible narration stand-in so both compositions prove
          # that Remotion carries the supplied audio prop into the final MP4.
          ffmpeg -y -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=12" \
            -af "volume=0.12" -ac 2 -c:a libmp3lame -b:a 128k public/smoke-narration.mp3
          test -s public/smoke-narration.mp3
          cat > /tmp/vetor-review-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/smoke-narration.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "visualTemplateId": "hologram-hud",
            "openingCreativeDirection": {
              "sceneId": "smoke-hook",
              "narrativeBeat": "hook",
              "primaryTemplate": "premium-product-3d",
              "supportTemplates": ["kinetic-typography", "cinematic-2d"],
              "templateIds": ["premium-product-3d", "kinetic-typography", "cinematic-2d"],
              "templateNames": ["Premium Product 3D", "Kinetic Typography", "Cinematic 2D"],
              "transitionIn": "cinematic-wipe",
              "energy": "high",
              "rhythmSeconds": 1.8,
              "visualLayers": ["three-orbit", "kinetic-type", "2d-parallax"],
              "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": false, "dataMustComeFromScene": true},
              "artDirection": "CI smoke: hook with 3D, kinetic typography and parallax"
            },
            "closingCreativeDirection": {
              "sceneId": "smoke-close",
              "narrativeBeat": "verdict",
              "primaryTemplate": "editorial-luxury",
              "supportTemplates": ["premium-product-3d", "kinetic-typography"],
              "templateIds": ["editorial-luxury", "premium-product-3d", "kinetic-typography"],
              "templateNames": ["Editorial Luxury", "Premium Product 3D", "Kinetic Typography"],
              "transitionIn": "soft-cut",
              "energy": "medium",
              "rhythmSeconds": 2.5,
              "visualLayers": ["editorial-frame", "three-orbit", "kinetic-type"],
              "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": false, "dataMustComeFromScene": true},
              "artDirection": "CI smoke: restrained verdict with product hero and kinetic accent"
            },
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 1,
            "scenes": [
              {"id": 1, "text": "Tela e desempenho para o uso cotidiano.", "duration": 4, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 30, "endFrame": 150,
                "creativeDirection": {
                  "sceneId": 1, "narrativeBeat": "specification", "primaryTemplate": "hologram-hud",
                  "supportTemplates": ["data-storytelling", "premium-product-3d"],
                  "templateIds": ["hologram-hud", "data-storytelling", "premium-product-3d"],
                  "templateNames": ["Hologram HUD", "Data Storytelling", "Premium Product 3D"],
                  "transitionIn": "scan-reveal", "energy": "medium", "rhythmSeconds": 2.5,
                  "visualLayers": ["hud-scan", "animated-metric", "three-orbit"],
                  "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": true, "dataMustComeFromScene": true},
                  "artDirection": "CI smoke: verified product image with a native 3D product stage",
                  "renderPlan": {"version":2,"renderer":"three-product","shotType":"3d-hero-orbit","action":"rotate-product-and-move-camera","cameraMove":"orbit","productProfile":"smartphone","productRepresentation":"parametric-archetype","assetRequirement":"supported-parametric-product-profile","hasMatchedBroll":true,"verifiedComponents":[],"usesTrueProductGeometry":false,"modelAssetStatus":"missing","visualFidelity":"illustrative-parametric-3d","motionContract":{"cameraMustMove":true,"objectMustMove":true,"minCameraTravel":0.55,"minScaleDelta":0.08},"fallbackReason":"Modelo 3D específico não verificado; usar somente arquétipo 3D ilustrativo."}
                }}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [{"start": 1, "end": 5, "text": "Tela e desempenho para o uso cotidiano.", "segmentKind": "scene"}],
            "brollVideos": ["/smoke-broll.mp4"],
            "totalDuration": 6,
            "fps": 30
          }
          JSON
          cat > /tmp/vetor-landscape-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/smoke-narration.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "openingCreativeDirection": {
              "sceneId": "smoke-hook",
              "narrativeBeat": "hook",
              "primaryTemplate": "premium-product-3d",
              "supportTemplates": ["kinetic-typography", "cinematic-2d"],
              "templateIds": ["premium-product-3d", "kinetic-typography", "cinematic-2d"],
              "templateNames": ["Premium Product 3D", "Kinetic Typography", "Cinematic 2D"],
              "transitionIn": "cinematic-wipe",
              "energy": "high",
              "rhythmSeconds": 1.8,
              "visualLayers": ["three-orbit", "kinetic-type", "2d-parallax"],
              "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": false, "dataMustComeFromScene": true},
              "artDirection": "CI smoke: hook with 3D, kinetic typography and parallax"
            },
            "closingCreativeDirection": {
              "sceneId": "smoke-close",
              "narrativeBeat": "verdict",
              "primaryTemplate": "editorial-luxury",
              "supportTemplates": ["premium-product-3d", "kinetic-typography"],
              "templateIds": ["editorial-luxury", "premium-product-3d", "kinetic-typography"],
              "templateNames": ["Editorial Luxury", "Premium Product 3D", "Kinetic Typography"],
              "transitionIn": "soft-cut",
              "energy": "medium",
              "rhythmSeconds": 2.5,
              "visualLayers": ["editorial-frame", "three-orbit", "kinetic-type"],
              "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": false, "dataMustComeFromScene": true},
              "artDirection": "CI smoke: restrained verdict with product hero and kinetic accent"
            },
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 2,
            "scenes": [
              {"id": 1, "text": "Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir.", "duration": 9, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 60, "endFrame": 330,
                "creativeDirection": {
                  "sceneId": 1, "narrativeBeat": "specification", "primaryTemplate": "hologram-hud",
                  "supportTemplates": ["data-storytelling", "premium-product-3d"],
                  "templateIds": ["hologram-hud", "data-storytelling", "premium-product-3d"],
                  "templateNames": ["Hologram HUD", "Data Storytelling", "Premium Product 3D"],
                  "transitionIn": "scan-reveal", "energy": "medium", "rhythmSeconds": 2.5,
                  "visualLayers": ["hud-scan", "animated-metric", "three-orbit"],
                  "assets": {"realProductImage": true, "galleryCutaway": false, "lifestyleFootage": false, "brollAvailable": true, "dataMustComeFromScene": true},
                  "artDirection": "CI smoke: verified product image with HUD and data overlay"
                }}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [{"start": 2, "end": 11, "text": "Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir.", "segmentKind": "scene"}],
            "brollVideos": ["/smoke-broll.mp4"],
            "totalDuration": 12,
            "fps": 30
          }
          JSON

      - name: Render vertical Remotion sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx ReviewVideo /tmp/vetor-review-smoke.mp4 --props=/tmp/vetor-review-smoke-props.json --frames=0-179 --log=error

      - name: Render landscape Remotion sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx LongReviewVideo /tmp/vetor-landscape-smoke.mp4 --props=/tmp/vetor-landscape-smoke-props.json --frames=0-359 --log=error

      - name: Run Remotion visual QA on rendered samples
        run: |
          npm install --global remotion-qa@0.1.3
          cat > /tmp/vetor-review-smoke-beats.json <<'JSON'
          [{"start":1,"end":5,"text":"Tela e desempenho para o uso cotidiano."}]
          JSON
          cat > /tmp/vetor-landscape-smoke-beats.json <<'JSON'
          [{"start":2,"end":11,"text":"Tela ampla e autonomia para a rotina. Compare as especificações e limitações com seu perfil de uso antes de decidir."}]
          JSON
          remotion-qa check /tmp/vetor-review-smoke.mp4 --beats /tmp/vetor-review-smoke-beats.json --channel yt-shorts --max-dead 1 --frames /tmp/vetor-review-qa-frames --json
          remotion-qa check /tmp/vetor-landscape-smoke.mp4 --beats /tmp/vetor-landscape-smoke-beats.json --channel yt-landscape --max-dead 1 --frames /tmp/vetor-landscape-qa-frames --json

      - name: Validate final MP4 artifacts at delivery specifications
        run: |
          node video/scripts/render-artifact-qa.mjs --input /tmp/vetor-review-smoke.mp4 --profile shorts --require-audio true --max-black-seconds 1.2 --report /tmp/vetor-review-artifact-qa.json
          node video/scripts/render-artifact-qa.mjs --input /tmp/vetor-landscape-smoke.mp4 --profile landscape --require-audio true --max-black-seconds 1.2 --report /tmp/vetor-landscape-artifact-qa.json

      - name: Validate visual diversity and exposure in rendered samples
        run: |
          cat > /tmp/vetor-review-visual-scenes.json <<'JSON'
          {"fps":30,"allowRepeatedScenes":true,"scenes":[{"id":"opening","startFrame":0,"endFrame":60},{"id":"feature","startFrame":60,"endFrame":120},{"id":"closing","startFrame":120,"endFrame":180}]}
          JSON
          cat > /tmp/vetor-landscape-visual-scenes.json <<'JSON'
          {"fps":30,"allowRepeatedScenes":true,"scenes":[{"id":"opening","startFrame":0,"endFrame":120},{"id":"feature","startFrame":120,"endFrame":240},{"id":"closing","startFrame":240,"endFrame":360}]}
          JSON
          node video/scripts/visual-artifact-qa.mjs --input /tmp/vetor-review-smoke.mp4 --scenes-json /tmp/vetor-review-visual-scenes.json --report /tmp/vetor-review-visual-qa.json
          node video/scripts/visual-artifact-qa.mjs --input /tmp/vetor-landscape-smoke.mp4 --scenes-json /tmp/vetor-landscape-visual-scenes.json --report /tmp/vetor-landscape-visual-qa.json

      - name: Preserve render quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vetor-render-quality-evidence-${{ github.run_id }}
          path: |
            /tmp/vetor-review-artifact-qa.json
            /tmp/vetor-landscape-artifact-qa.json
            /tmp/vetor-review-visual-qa.json
            /tmp/vetor-landscape-visual-qa.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke-test Lemo-Opuscar renderer without publishing
        timeout-minutes: 15
        env:
          LEMO_OPUSCAR_HOME: ${{ runner.temp }}/vetor-lemo-opuscar-smoke
        run: node video/scripts/lemo-opuscar-smoke.mjs

      - name: Install Edge TTS for Lemo quality pilot
        if: github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Render mixed creative direction pilot (no publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        working-directory: video
        timeout-minutes: 20
        run: node scripts/render-mixed-creative-pilot.mjs

      - name: Upload mixed creative direction pilot
        if: success() && github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        uses: actions/upload-artifact@v4
        with:
          name: vetor-piloto-direcao-criativa-mista
          path: video/artifacts/vetor-piloto-direcao-criativa-mista.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Render ten-style Remotion showcase (no publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        working-directory: video
        timeout-minutes: 20
        run: node scripts/render-ten-style-pilot.mjs

      - name: Upload ten-style showcase pilot
        if: success() && github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        uses: actions/upload-artifact@v4
        with:
          name: vetor-10-estilos-motion-pilot
          path: video/artifacts/vetor-10-estilos-motion-pilot.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Render Galaxy Fit3 motion-graphics pilot with Lemo-Opuscar
        if: github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        timeout-minutes: 20
        env:
          LEMO_OPUSCAR_HOME: ${{ runner.temp }}/vetor-lemo-opuscar-smoke
          EDGE_TTS_RATE: "+8%"
        run: node video/scripts/render-lemo-galaxy-fit3-pilot.mjs

      - name: Upload Lemo-Opuscar quality pilot (no YouTube publishing)
        if: success() && github.event_name == 'workflow_dispatch' && inputs.run_visual_pilots
        uses: actions/upload-artifact@v4
        with:
          name: vetor-lemo-opuscar-galaxy-fit3-pilot
          path: video/artifacts/vetor-lemo-galaxy-fit3-motion-pilot.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Remotion render evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-render-smoke-failure-${{ github.run_id }}
          path: |
            /tmp/vetor-review-smoke.mp4
            /tmp/vetor-landscape-smoke.mp4
            /tmp/vetor-review-qa-frames/**
            /tmp/vetor-landscape-qa-frames/**
          if-no-files-found: ignore
          retention-days: 7
