name: Validate Video Pipeline

on:
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/video-pipeline-validation.yml"
      - "scripts/tts.py"
  pull_request:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - ".github/workflows/video-pipeline-validation.yml"

permissions:
  contents: read

concurrency:
  group: video-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: npm ci
      
      - name: Syntax-check Edge TTS metadata runner
        run: python -m py_compile scripts/tts.py

      - name: Validate format, affiliate-link and chapter contracts
        run: node video/scripts/video-format.test.mjs

      - name: Validate worker JavaScript syntax
        run: node --check video/scripts/process-video.mjs && node --check video/scripts/video-format.mjs

      - name: Type-check Remotion project
        working-directory: video
        run: npx tsc --noEmit

      - name: Install Remotion browser
        working-directory: video
        run: npx remotion browser ensure --log info

      - name: Resolve Remotion compositions
        working-directory: video
        shell: bash
        run: |
          set -euo pipefail
          ids="$(npx remotion compositions src/Root.tsx --quiet)"
          echo "Detected Remotion compositions: $ids"
          for expected in ReviewVideo LongReviewVideo ComparisonVideo; do
            if ! grep -qw "$expected" <<< "$ids"; then
              echo "::error::Missing Remotion composition: $expected"
              exit 1
            fi
          done

      - name: Render portrait sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx ReviewVideo /tmp/vetor-review-smoke.mp4 --frames=0-89 --log=error

      - name: Render landscape sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx LongReviewVideo /tmp/vetor-landscape-smoke.mp4 --frames=0-89 --log=error

      - name: Check rendered sample safe zones
        run: |
          npm install --global remotion-qa@0.1.3
          remotion-qa safezone /tmp/vetor-review-smoke.mp4 --channel yt-shorts --json
          remotion-qa safezone /tmp/vetor-landscape-smoke.mp4 --channel yt-landscape --json

      - name: Preserve render smoke samples on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-failure-${{ github.run_id }}
          path: |
            /tmp/vetor-review-smoke.mp4
            /tmp/vetor-landscape-smoke.mp4
          if-no-files-found: ignore
          retention-days: 7
