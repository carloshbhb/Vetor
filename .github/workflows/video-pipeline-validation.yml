name: Validate Video Pipeline

on:
  push:
    branches: [main]
    paths:
      - "video/**"
      - ".github/workflows/video-pipeline-validation.yml"
      - "scripts/tts.py"
  pull_request:
    branches: [main]
    paths:
      - "video/**"
      - "scripts/tts.py"
      - ".github/workflows/video-pipeline-validation.yml"

permissions:
  contents: read

concurrency:
  group: video-pipeline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install video dependencies
        working-directory: video
        run: npm ci
      
      - name: Syntax-check Edge TTS metadata runner
        run: python -m py_compile scripts/tts.py

      - name: Validate format, affiliate-link and chapter contracts
        run: node video/scripts/video-format.test.mjs

      - name: Validate worker JavaScript syntax
        run: node --check video/scripts/process-video.mjs && node --check video/scripts/video-format.mjs

      - name: Type-check Remotion project
        working-directory: video
        run: npx tsc --noEmit

      - name: Install Remotion browser
        working-directory: video
        run: npx remotion browser ensure --log info

      - name: Resolve Remotion compositions
        working-directory: video
        shell: bash
        run: |
          set -euo pipefail
          ids="$(npx remotion compositions src/Root.tsx --quiet)"
          echo "Detected Remotion compositions: $ids"
          for expected in ReviewVideo LongReviewVideo ComparisonVideo; do
            if ! grep -qw "$expected" <<< "$ids"; then
              echo "::error::Missing Remotion composition: $expected"
              exit 1
            fi
          done

      - name: Prepare local smoke-test media and props
        working-directory: video
        run: |
          cat > public/smoke-product.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#1428A0"/>
                <stop offset="1" stop-color="#080C14"/>
              </linearGradient>
            </defs>
            <rect width="1200" height="900" rx="64" fill="url(#g)"/>
            <rect x="410" y="130" width="380" height="640" rx="48" fill="#F7FAFF" opacity=".94"/>
            <rect x="440" y="170" width="320" height="560" rx="30" fill="#0F1623"/>
            <circle cx="600" cy="198" r="8" fill="#70C4FF"/>
            <text x="600" y="470" text-anchor="middle" fill="#70C4FF" font-family="Arial,sans-serif" font-size="52" font-weight="700">VETOR</text>
            <text x="600" y="530" text-anchor="middle" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="26">SMOKE TEST</text>
          </svg>
          SVG
          cat > /tmp/vetor-review-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/audio/sample-review.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 1,
            "scenes": [
              {"id": 1, "text": "Tela e desempenho para o uso cotidiano.", "duration": 1.5, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 30, "endFrame": 75}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [],
            "brollVideos": [],
            "totalDuration": 3,
            "fps": 30
          }
          JSON
          cat > /tmp/vetor-landscape-smoke-props.json <<'JSON'
          {
            "title": "Produto de demonstração",
            "imageUrl": "/smoke-product.svg",
            "productImages": ["/smoke-product.svg"],
            "audioUrl": "/audio/sample-review.mp3",
            "score": 8.5,
            "category": "Tecnologia",
            "hook": "O detalhe que muda a decisão",
            "hookDuration": 2,
            "scenes": [
              {"id": 1, "text": "Tela e desempenho para o uso cotidiano.", "duration": 9, "visualCue": "Tela e desempenho", "brollKeywords": [], "startFrame": 60, "endFrame": 330}
            ],
            "callToAction": "Confira a análise completa.",
            "subtitleEntries": [],
            "brollVideos": [],
            "totalDuration": 12,
            "fps": 30
          }
          JSON

      - name: Validate Remotion public media path contract
        working-directory: video
        run: node scripts/media-source.test.mjs

      - name: Render portrait sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx ReviewVideo /tmp/vetor-review-smoke.mp4 --props=/tmp/vetor-review-smoke-props.json --frames=0-89 --log=error

      - name: Render landscape sample without publishing
        working-directory: video
        timeout-minutes: 10
        run: npx remotion render src/Root.tsx LongReviewVideo /tmp/vetor-landscape-smoke.mp4 --props=/tmp/vetor-landscape-smoke-props.json --frames=0-359 --log=error

      - name: Check rendered sample safe zones
        run: |
          npm install --global remotion-qa@0.1.3
          remotion-qa safezone /tmp/vetor-review-smoke.mp4 --channel yt-shorts
          remotion-qa safezone /tmp/vetor-landscape-smoke.mp4 --channel yt-landscape

      - name: Preserve render smoke samples on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke-failure-${{ github.run_id }}
          path: |
            /tmp/vetor-review-smoke.mp4
            /tmp/vetor-landscape-smoke.mp4
          if-no-files-found: ignore
          retention-days: 7
