name: Groq Model Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groq-model-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated Groq benchmark
        run: node scripts/benchmark-groq-models.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-model-benchmark
          path: |
            artifacts/groq-model-benchmark.json
            artifacts/groq-model-benchmark.md
          if-no-files-found: warn
          retention-days: 14
