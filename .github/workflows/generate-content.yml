name: Generate Content

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'tmp/generate-2-landing-pages.ts'
      - '.github/workflows/generate-content.yml'
  workflow_dispatch:
    inputs:
      test_product_id:
        description: 'Optional product_links.id; use first-eligible to test one LP draft'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate search-engine notification contract
        run: npm run test:indexing-contract
      - name: Validate IndexNow key and public verification file
        run: npm run validate:indexnow-config
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
      - name: Validate required credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY:-}${GROQ_API_KEY:-}${NVIDIA_API_KEY:-}" ]; then
            echo "::error::Configure at least one LLM secret: OPENROUTER_API_KEY, GROQ_API_KEY or NVIDIA_API_KEY."
            exit 1
          fi
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SERVICE_KEY:-}" || { echo "::error::Configure SUPABASE_SERVICE_ROLE_KEY or SUPABASE_SERVICE_KEY."; exit 1; }
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is missing."; exit 1; }
          echo "At least one LLM and the Supabase secrets are present (values are not displayed)."
      - name: Generate content (OpenRouter free → Groq → NVIDIA)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-landing-smoke-test]')
        run: npx tsx tmp/generate-2-landing-pages.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
          NVIDIA_FALLBACK_MODEL: 'nvidia/nemotron-3.5-super-vl-120b-a12b'
          NEXT_PUBLIC_SUPABASE_URL: https://jcfbkwnkruncefrnnwqv.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.REPO_OWNER_TOKEN }}
          GITHUB_REPO: carloshbhb/Vetor
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          LANDING_TEST_PRODUCT_ID: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-landing-smoke-test]') && 'first-eligible' || inputs.test_product_id || '' }}
